<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- Zona central de la campana: intervalo de confianza -->
    <clipPath id="ci">
      <rect x="206" y="0" width="100" height="512"/>
    </clipPath>
    <radialGradient id="glow" cx="50%" cy="38%" r="60%">
      <stop offset="0" stop-color="#A8E6CF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#A8E6CF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Fondo -->
  <rect width="512" height="512" rx="112" fill="#0B0C0E"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>
  <rect x="3" y="3" width="506" height="506" rx="109" fill="none" stroke="#272B30" stroke-width="6"/>

  <!-- Campana de Gauss (colas en menta) -->
  <path id="bell"
        d="M92 360 C 170 360, 196 120, 256 120 C 316 120, 342 360, 420 360 Z"
        fill="#A8E6CF"/>

  <!-- Intervalo de confianza (centro en blanco) -->
  <path d="M92 360 C 170 360, 196 120, 256 120 C 316 120, 342 360, 420 360 Z"
        fill="#FFFFFF" clip-path="url(#ci)"/>

  <!-- Línea base -->
  <rect x="84" y="384" width="344" height="18" rx="9" fill="#FFFFFF"/>
</svg>
